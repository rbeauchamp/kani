name: Qualification infrastructure

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
    paths:
      - .github/workflows/qualification-core-v1.yml
      - Cargo.toml
      - Cargo.lock
      - qualification/**
      - tools/kani-qualify/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualification-core-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-tests:
    name: Qualification tests
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the qualification program
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Kani Dependencies
        uses: ./.github/actions/setup
        with:
          os: ubuntu-22.04

      - name: Test kani-qualify tool
        run: cargo test -p kani-qualify

      - name: Test gate policy
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s qualification/scripts -p 'test_*.py' -v

      - name: Build Kani
        run: cargo build-dev

      - name: Prove result-count admission against mathematical counts
        run: ./scripts/kani qualification/proofs/result_counts.rs

      - name: Exercise mutation infrastructure against this build
        run: |
          cargo run -p kani-qualify -- mutation-self-test \
            --fixtures qualification/fixtures/mutations \
            --kani-bin target/kani/bin/kani-driver
