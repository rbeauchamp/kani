name: Qualified core-v1 replay

on:
  push:
    branches:
      - qualification/bootstrap
    paths:
      - .github/workflows/qualification-core-v1.yml
      - qualification/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualification-core-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  policy-tests:
    name: Gate policy tests
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the qualification program
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Test the fail-closed gate
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s qualification/scripts -p 'test_*.py' -v
