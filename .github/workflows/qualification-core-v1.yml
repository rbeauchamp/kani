name: Qualified core-v1 replay

on:
  pull_request:
    paths:
      - .github/workflows/qualification-core-v1.yml
      - Cargo.toml
      - Cargo.lock
      - qualification/**
      - tools/kani-qualify/**
  merge_group:
  push:
    branches:
      - main
    paths:
      - .github/workflows/qualification-core-v1.yml
      - Cargo.toml
      - Cargo.lock
      - qualification/**
      - tools/kani-qualify/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualification-core-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-tests:
    name: Qualification tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the qualification program
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Kani Dependencies
        uses: ./.github/actions/setup
        with:
          os: ubuntu-24.04

      - name: Test kani-qualify tool
        run: cargo test -p kani-qualify

      - name: Test gate policy
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s qualification/scripts -p 'test_*.py' -v
