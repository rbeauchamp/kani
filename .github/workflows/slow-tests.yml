# We use block scalar notation to allow us to add ":" to the workflow name.
name: >-
  Nightly: Slow tests

permissions:
  contents: read

on:
  schedule:
    - cron: "30 5 * * *" # Run this every day at 05:30 UTC
  workflow_dispatch:     # Allow manual dispatching for a custom branch / tag.

env:
  RUST_BACKTRACE: 1

jobs:
  regression:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Supported platforms only; Intel macOS is outside downstream scope.
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - name: Checkout Kani
        uses: actions/checkout@v6

      - name: Setup Kani Dependencies
        uses: ./.github/actions/setup
        with:
          os: ${{ matrix.os }}

      - name: Build Kani
        run: cargo build-dev

      - name: Run Kani's slow tests
        run: ./scripts/kani-slow-tests.sh

  perf:
    # Scheduled home for the performance suite, relocated from per-PR runs in
    # kani.yml (issue #5). Also dispatchable manually against any branch, which
    # is the explicit pre-merge opt-in for this coverage.
    runs-on: ubuntu-24.04
    # The full perf suite runs in ~45 min (matching main): most cases finish in
    # seconds; the heaviest, s2n-quic-core, runs 34 harnesses in ~1500s. The
    # per-test guardrail in scripts/kani-perf.sh (2400s) sits above that. The
    # 180-min step timeout leaves ample headroom over that realistic runtime,
    # and the job timeout sits above (step timeout) x (max_attempts) so a retry
    # can still land.
    timeout-minutes: 380
    steps:
      - name: Checkout Kani
        uses: actions/checkout@v6

      - name: Setup Kani Dependencies
        uses: ./.github/actions/setup
        with:
          os: ubuntu-24.04

      - name: Execute Kani performance tests
        # Retry on infra-driven failures (spot preemption / runner shutdown).
        # The script itself bounds per-test wall time, so functional regressions
        # surface as normal test failures and are not retried indefinitely.
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 180
          max_attempts: 2
          command: ./scripts/kani-perf.sh
        env:
          RUST_TEST_THREADS: 1
