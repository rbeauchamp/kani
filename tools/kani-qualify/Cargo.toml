[package]
name = "kani-qualify"
description = "Verification qualification, profile gating, and red-mutation test runner"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27"
wait-timeout = "0.2"

[lints]
workspace = true
